# Drop-in do catálogo para o serviço do site.  Instale com
#
#   sudo install -d -m 0755 /etc/systemd/system/ntbuilder-web.service.d
#   sudo install -m 0644 web/deploy/ntbuilder-web-catalogue.conf \
#        /etc/systemd/system/ntbuilder-web.service.d/catalogue.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ntbuilder-web
#
# A credencial de e-mail NÃO vem daqui.  /etc/msmtprc é root:slurm 0640, para o
# Slurm mandar os avisos de job, e o site roda como outro usuário; a cópia
# abaixo é lida só pelo dono, e o msmtp exige exatamente isso (0400/0600):
#
#   sudo install -d -m 0755 /etc/ntbuilder
#   sudo install -o mpereira -g root -m 0400 /etc/msmtprc /etc/ntbuilder/msmtprc
#
# Nenhuma senha entra no repositório.
[Service]
Environment="NTB_MSMTP_CONFIG=/etc/ntbuilder/msmtprc"
Environment="NTB_BASE_URL=https://nanoeng.unb.br/ntbuilder"
Environment="NTB_REQUEST_QUEUE=high"
# Onde os pedidos e o catálogo do cluster ficam (o job do nó vê o mesmo
# diretório por /mnt/home/$USER/projects).
Environment="NTB_LOCAL_ROOT=/home/mpereira/projects"
Environment="NTB_CLUSTER_ROOT=/mnt/home/mpereira/projects"
